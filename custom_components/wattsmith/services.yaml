query_history:
  name: Query History
  description: >-
    Read a time range out of the never-purged 15-minute history DB (separate
    from HA's own recorder, which purges after ~10 days). Returns rows as a
    service response — call with return_response to get the data back.
  fields:
    start:
      name: Start
      description: Start of the range (inclusive).
      required: true
      selector:
        datetime:
    end:
      name: End
      description: End of the range (inclusive).
      required: true
      selector:
        datetime:
    table:
      name: Table
      description: Which table to read from.
      required: false
      default: bucket
      selector:
        select:
          options:
            - bucket
            - battery_bucket
            - config_snapshot
            - config_event
    battery_id:
      name: Battery ID
      description: Only for the battery_bucket table — filter to a single battery.
      required: false
      selector:
        text:
    limit:
      name: Limit
      description: Maximum rows to return.
      required: false
      default: 1000
      selector:
        number:
          min: 1
          max: 5000
          step: 1
          mode: box

backfill_ev_energy:
  name: Backfill EV energy history
  description: >-
    Writes EV charging energy from before the EV Energy sensor existed into its
    long-term statistics, so the Energy dashboard shows the full history. Uses an
    older statistic of the same charger meter when given (exact totals) and
    Wattsmith's 15-minute history DB for the hour-by-hour shape. Dry run by
    default: it only reports what it would write. Safe to run more than once.
  fields:
    meter_statistic_id:
      name: Old meter statistic
      description: >-
        Optional. A long-term statistic of the same lifetime counter from a
        removed charger integration, e.g. sensor.goe_318468_eto.
      required: false
      example: sensor.goe_318468_eto
      selector:
        text:
    dry_run:
      name: Dry run
      description: Only report the plan, write nothing.
      required: false
      default: true
      selector:
        boolean:

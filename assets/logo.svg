<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="44" y1="0" x2="212" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg4)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- ascending W: peaks + valleys both climb left->right, faceted lightning-blade shards,
       one red (low charge) -> amber -> green (full charge) colour sweep -->
  <g fill="url(#boltGrad)" stroke="#111827" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="44,132 57.7,176.2 93,206 79.3,161.8"/>
    <polygon points="93,206 124.8,155.5 128,96 96.2,146.5"/>
    <polygon points="128,96 129.9,142.8 163,176 161.1,129.2"/>
    <polygon points="163,176 205.3,115.5 212,42 169.7,102.5"/>
  </g>

  <!-- tip glints, colour-matched to the charge-level sweep -->
  <circle cx="44" cy="132" r="4" fill="#fca5a5"/>
  <circle cx="128" cy="96" r="4" fill="#fcd34d"/>
  <circle cx="212" cy="42" r="4" fill="#86efac"/>
</svg>
